<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1b2333;--mute:#667085;--line:#dedbd2;--side:#13223f;--sidetx:#c9d3e6;--acc:#8a5d0e;--accbg:#f3e7c9;--ok:#1d6b4a;--okbg:#d9efe4;--bad:#a3262a;--badbg:#f8dcdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--card:#17213a;--ink:#e8ecf4;--mute:#97a3b8;--line:#2a3652;--side:#0a1020;--sidetx:#b4c0d8;--acc:#e0b050;--accbg:#3a2f14;--ok:#6fd0a0;--okbg:#14382a;--bad:#ff8a8d;--badbg:#431a1c}}
:root[data-theme="dark"]{--bg:#0e1522;--card:#17213a;--ink:#e8ecf4;--mute:#97a3b8;--line:#2a3652;--side:#0a1020;--sidetx:#b4c0d8;--acc:#e0b050;--accbg:#3a2f14;--ok:#6fd0a0;--okbg:#14382a;--bad:#ff8a8d;--badbg:#431a1c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Public Sans",system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:240px;background:var(--side);color:var(--sidetx);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h2{font:600 18px/1.2 Newsreader,Georgia,serif;color:#fff;margin:0 8px 18px}
nav button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;width:100%;padding:10px;border-radius:6px;cursor:pointer;font-size:14px}
nav button:hover{background:rgba(255,255,255,.07)}
nav button[aria-pressed=true]{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
nav span{opacity:.7}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--acc);outline-offset:2px}
main{flex:1;padding:32px clamp(16px,4vw,48px);min-width:0;max-width:1100px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
#act{display:flex;gap:8px;flex-wrap:wrap}
h1{font:600 clamp(26px,4vw,38px)/1.1 Newsreader,Georgia,serif;margin:0 0 6px}
h3{font:600 19px/1.2 Newsreader,Georgia,serif;margin:0;overflow-wrap:anywhere}
.sub{color:var(--mute);margin:0 0 18px;font-size:14px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.filters input{flex:1 1 220px;width:auto}.filters select{width:auto;flex:0 1 230px}
.msg{background:var(--okbg);color:var(--ok);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}.msg.bad{background:var(--badbg);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card p{margin:0;color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.tag{align-self:flex-start;font-size:12px;background:var(--accbg);color:var(--acc);padding:2px 8px;border-radius:4px;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}
.card.done h3{text-decoration:line-through;opacity:.6}
.row{display:flex;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap;align-items:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-weight:500;color:var(--ink)}
.btn.main{background:#E7A652;border-color:#E7A652;color:#1b1405}
nav .logo{display:block;width:100%;background:#fff;border-radius:10px;padding:6px;margin:0 0 20px}
.hero{display:block;height:84px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:0 0 20px}
:root[data-theme="dark"] .btn.main{color:#1b1405}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.main{color:#1b1405}}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.mini{padding:2px 8px;font-size:12px;margin-left:6px}
.pw{font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font:600 24px/1.1 Newsreader,Georgia,serif}.stat span{font-size:13px;color:var(--mute)}.stat.bad b{color:var(--bad)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.box ul{list-style:none;margin:10px 0 0;padding:0}.box li{padding:9px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;font-size:14px}
.box li span,.empty{color:var(--mute);font-size:13px}.empty{padding:24px 0;font-size:14px}
.lk{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;font-size:14px}
.box li:has(.lk){flex-direction:row}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(540px,92vw);padding:22px;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 4px}
.chk{display:flex;gap:6px;align-items:center;font-weight:400;margin:6px 0 0}.chk input{width:auto}
#gate .hero{height:auto;width:100%;max-width:340px;margin:0 auto 14px}
.filters[hidden]{display:none}
.tabs{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.btn.on{background:var(--side);color:#fff;border-color:var(--side)}.mt{text-transform:capitalize;min-width:150px;text-align:center}
.calw{overflow-x:auto}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:600px}.cal .wd{font-size:12px;color:var(--mute);text-align:center}
.cal .d{min-height:92px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px;font-size:12px;overflow:hidden}.cal .d.o{opacity:.45}.cal .d.t{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.ev{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;border-radius:3px;padding:1px 4px;margin-top:2px;background:var(--accbg);color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.ev.bad{background:var(--badbg);color:var(--bad)}.ev.ok{background:var(--okbg);color:var(--ok);text-decoration:line-through}
.hist{list-style:none;margin:14px 0 0;padding:0}.hist li{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.tblw{overflow-x:auto;margin-bottom:20px}.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px}.tbl th,.tbl td{padding:9px 12px;border-top:1px solid var(--line);text-align:left}.tbl th{font-weight:600;border-top:0;color:var(--mute)}.tbl .n{text-align:right}
.err{color:var(--bad);font-size:13px;margin:10px 0 0;min-height:1em}
@media(max-width:760px){body{display:block}nav{width:auto;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px}nav h2{display:none}nav .logo{display:none}nav button{width:auto;white-space:nowrap;gap:6px;background:rgba(255,255,255,.07);flex:none}main{padding-top:20px}}

:root{--bg:#faf7f2;--card:#fff;--ink:#1f2430;--mute:#6b7280;--line:#ece6dc;--side:#fff;--acc:#8a5d0e;--accbg:#fbeed8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--card:#1a1f2a;--ink:#e8eaf0;--mute:#9aa3b2;--line:#2a3140;--side:#151922;--acc:#E7A652;--accbg:#3a2d14}}
:root[data-theme="dark"]{--bg:#11141b;--card:#1a1f2a;--ink:#e8eaf0;--mute:#9aa3b2;--line:#2a3140;--side:#151922;--acc:#E7A652;--accbg:#3a2d14}
.app{display:flex;width:100%;min-height:100vh}.mw{flex:1;min-width:0;display:flex;flex-direction:column}.mw main{width:100%;max-width:1180px}
#t{display:none}.head[hidden]{display:none}
#nav{width:250px;flex:none;background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:16px 12px;display:flex;flex-direction:column}
.brand img{display:block;width:100%;max-width:210px;margin:2px auto 14px;border-radius:8px}
:root[data-theme="dark"] .brand img{background:#fff;padding:4px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand img{background:#fff;padding:4px}}
.sec{font-size:11px;letter-spacing:.1em;color:var(--mute);margin:12px 10px 6px;font-weight:600}
.ni{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink)}
.ni:hover{background:var(--accbg)}.ni[aria-pressed=true]{background:var(--accbg);color:var(--acc);font-weight:600}.nl{flex:1}.nc{font-size:12px;color:var(--mute)}
.ic{width:18px;height:18px;flex:none}
.nfoot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}.off{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 10px;color:var(--mute)}
.usr{display:flex;gap:10px;align-items:center;padding:8px 10px}.av{width:32px;height:32px;border-radius:50%;background:var(--accbg);color:var(--acc);display:grid;place-items:center;font-weight:600;flex:none}
.un{display:flex;flex-direction:column;min-width:0}.un b{font-size:13px}.un small{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.ttl{font-size:15px;margin-left:4px}.sp{flex:1}
.ib{all:unset;box-sizing:border-box;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}.ib:hover{background:var(--accbg)}.ib svg{width:19px;height:19px}
.gs{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg);min-width:260px;color:var(--mute)}.gs svg{width:16px;height:16px;flex:none}
.gs input{border:0;background:transparent;padding:8px 0;width:100%}.gs input:focus-visible{outline:none}.gs:focus-within{outline:2px solid var(--acc)}
.gs kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap}
.nw{position:relative}.menu{position:absolute;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:10}.menu[hidden]{display:none}
.menu button{all:unset;box-sizing:border-box;display:block;width:100%;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:14px}.menu button:hover{background:var(--accbg)}
.sh{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--mute);margin:28px 0 14px}.sh i{width:3px;height:16px;border-radius:2px;display:inline-block}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.tool{all:unset;box-sizing:border-box;display:flex;gap:14px;align-items:flex-start;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer;position:relative;min-height:104px}
.tool:hover{border-color:var(--acc);box-shadow:0 2px 12px rgba(0,0,0,.06)}.tool[disabled]{opacity:.65;cursor:default}.tool[disabled]:hover{border-color:var(--line);box-shadow:none}
.ti{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c)}.ti svg{width:22px;height:22px}
.tx{display:flex;flex-direction:column;gap:4px;min-width:0}.tx b{font-size:16px;font-weight:600}.tx span{color:var(--mute);font-size:14px}
.bd{position:absolute;top:-10px;right:14px;font-style:normal;font-size:11px;background:var(--card);color:var(--mute);border:1px solid var(--line);padding:1px 8px;border-radius:999px}
.btn.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
.card,.stat,.box,.tbl{border-radius:14px}
h3,.stat b,#gate h3{font-family:inherit}h3{font-size:17px}.stat b{font-size:22px}
.ov{display:none}
@media(min-width:861px){.app.col #nav{display:none}}
@media(max-width:860px){#nav{position:fixed;left:0;top:0;bottom:0;z-index:30;height:auto;transform:translateX(-100%);transition:transform .2s}.app.open #nav{transform:none;box-shadow:0 0 30px rgba(0,0,0,.25)}.sp{display:none}.app.open~.ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}.gs{min-width:0;flex:1}.gs kbd,.ib.opt{display:none}.top{padding:8px 12px}}

.kb{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:12px}
.kc{flex:0 0 262px;background:color-mix(in srgb,var(--line) 35%,var(--bg));border:1px solid var(--line);border-radius:14px;padding:10px;min-height:140px}
.kc h4{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}.kc h4 span{color:var(--mute);font-weight:400}
.kk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:3px;cursor:grab;font-size:13px}
.kk b{font-size:14px}.kk span,.kk small{color:var(--mute)}.kr{display:flex;gap:6px;margin-top:6px}.kr select{flex:1;min-width:0;padding:5px;font-size:12px}
.mi{flex-direction:row!important;justify-content:space-between;align-items:center;gap:8px}
.pvw{max-height:64vh;overflow:auto;margin:12px 0}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;font:13px/1.55 Georgia,"Times New Roman",serif;overflow:hidden}
.paper img{display:block;width:100%}.paper h1{font-size:16px;text-align:center;margin:18px 28px}.paper h2{font-size:13px;margin:14px 28px 4px}.paper p{margin:0 28px 10px;white-space:pre-line;text-align:justify}
#dv{width:min(860px,95vw)}.pre{white-space:pre-wrap;font:14px/1.6 inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:50vh;overflow:auto;margin:12px 0}
#d2 textarea{font:inherit}.ol{margin:12px 0;padding-left:20px;font-size:14px}.ol li{margin:6px 0}
#pa{display:none}

#pa .lh{position:fixed;top:0;left:0;width:210mm}#pa .lf{position:fixed;bottom:0;left:0;width:210mm}}

.tbw{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tbx{width:100%;border-collapse:collapse;font-size:14px}.tbx th{position:sticky;top:0;z-index:1;background:var(--card);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbx td{padding:2px 4px;border-top:1px solid var(--line)}.tbx tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--line) 22%,var(--card))}.tbx tbody tr:hover td{background:var(--accbg)}
.sb{all:unset;cursor:pointer;font-weight:600;color:var(--ink)}.sb:focus-visible{outline:2px solid var(--acc)}
.ce{border:1px solid transparent;border-radius:4px;padding:7px 6px;text-overflow:ellipsis;background:transparent;width:100%;min-width:100px;font:inherit}.ce:hover{border-color:var(--line)}.ce:focus{background:var(--bg);border-color:var(--acc);outline:none}
.tbx td.ac{white-space:nowrap;padding:2px 8px}.tbx .btn.mini{margin:0 2px 0 0}
</style>
</head>
<body>
<div class="app" id="app"><aside id="nav" aria-label="Menu"></aside><div class="mw"><header class="top" id="top"></header>
<main>
<div class="head" id="hd"><div><h1 id="t"></h1><p class="sub"><span id="s"></span> <span id="st"></span></p></div><div id="act"></div></div>
<div id="msg" role="status"></div>
<div class="filters" id="flt" hidden><input type="search" id="q" placeholder="Buscar por nome, CPF, tipo ou andamento" aria-label="Buscar"><select id="fs" aria-label="Filtrar por situação"></select><select id="fr" aria-label="Filtrar por responsável"></select></div>
<div id="c"></div>
</main></div></div><div class="ov" id="ov"></div><input id="imp" type="file" accept=".xlsx,.xls" hidden>
<dialog id="gate"><img class="hero" alt="Flavio Junior Advocacia" id="gl"><h3>Acesso restrito</h3><p class="sub" id="g_hint"></p>
<div id="g_acc"><label for="g_email">E-mail</label><input id="g_email" type="email" autocomplete="username"><label for="g_pw">Senha de acesso</label><input id="g_pw" type="password" autocomplete="current-password"></div>
<label for="g_key">Senha de criptografia</label><input id="g_key" type="password" autocomplete="off">
<div id="g_key2w" hidden><label for="g_key2">Repita a senha de criptografia</label><input id="g_key2" type="password" autocomplete="off"></div>
<p class="err" id="g_err" role="alert"></p><div class="row"><button class="btn main" id="g_go">Entrar</button><button class="btn" id="g_out" hidden>Sair</button></div></dialog>
<dialog id="dv"><h3 id="dvt"></h3><div id="dvb"></div></dialog>
<div id="pa"></div>
<dialog id="d2"><h3 id="d2t"></h3><div id="d2b"></div><div class="row"><button class="btn" id="d2x">Fechar</button></div></dialog>

else if(h[1]=="TIPO DE DEMANDA"){const B=(h[3]||"").startsWith("VALORES");rows.slice(1).forEach(r=>{const nome=t(r[0]);if(!nome)return;
const c=B?{nome,tipo:t(r[1]),sit:up(r[2]),valor:num(r[3]),cpf:t(r[4]),senha:t(r[5]),resp:up(r[6]),obs:""}:{nome,tipo:t(r[1]),sit:up(r[2]),valor:num(r[7]??""),cpf:t(r[3]),senha:t(r[4]),resp:up(r[5]),obs:t(r[6])};
const k=keyOf(c),e=idx.get(k);if(e){let ch=0;for(const f in c)if((e[f]===""||e[f]==null)&&c[f]!==""){e[f]=c[f];ch=1}ch?mg++:sk++;return}
c.id=uid();S.cases.push(c);idx.set(k,c);nc++})}}
