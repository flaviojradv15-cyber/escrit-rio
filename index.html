<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flavio Junior Advocacia</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1b2333;--mute:#667085;--line:#dedbd2;--side:#13223f;--sidetx:#c9d3e6;--acc:#8a5d0e;--accbg:#f3e7c9;--ok:#1d6b4a;--okbg:#d9efe4;--bad:#a3262a;--badbg:#f8dcdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--card:#17213a;--ink:#e8ecf4;--mute:#97a3b8;--line:#2a3652;--side:#0a1020;--sidetx:#b4c0d8;--acc:#e0b050;--accbg:#3a2f14;--ok:#6fd0a0;--okbg:#14382a;--bad:#ff8a8d;--badbg:#431a1c}}
:root[data-theme="dark"]{--bg:#0e1522;--card:#17213a;--ink:#e8ecf4;--mute:#97a3b8;--line:#2a3652;--side:#0a1020;--sidetx:#b4c0d8;--acc:#e0b050;--accbg:#3a2f14;--ok:#6fd0a0;--okbg:#14382a;--bad:#ff8a8d;--badbg:#431a1c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Public Sans",system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:240px;background:var(--side);color:var(--sidetx);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h2{font:600 18px/1.2 Newsreader,Georgia,serif;color:#fff;margin:0 8px 18px}
nav button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;width:100%;padding:10px;border-radius:6px;cursor:pointer;font-size:14px}
nav button:hover{background:rgba(255,255,255,.07)}
nav button[aria-pressed=true]{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
nav span{opacity:.7}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--acc);outline-offset:2px}
main{flex:1;padding:32px clamp(16px,4vw,48px);min-width:0;max-width:1100px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
#act{display:flex;gap:8px;flex-wrap:wrap}
h1{font:600 clamp(26px,4vw,38px)/1.1 Newsreader,Georgia,serif;margin:0 0 6px}
h3{font:600 19px/1.2 Newsreader,Georgia,serif;margin:0;overflow-wrap:anywhere}
.sub{color:var(--mute);margin:0 0 18px;font-size:14px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.filters input{flex:1 1 220px;width:auto}.filters select{width:auto;flex:0 1 230px}
.msg{background:var(--okbg);color:var(--ok);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}.msg.bad{background:var(--badbg);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.card p{margin:0;color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.tag{align-self:flex-start;font-size:12px;background:var(--accbg);color:var(--acc);padding:2px 8px;border-radius:4px;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}
.card.done h3{text-decoration:line-through;opacity:.6}
.row{display:flex;gap:8px;margin-top:auto;padding-top:8px;flex-wrap:wrap;align-items:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-weight:500;color:var(--ink)}
.btn.main{background:#E7A652;border-color:#E7A652;color:#1b1405}
nav .logo{display:block;width:100%;background:#fff;border-radius:10px;padding:6px;margin:0 0 20px}
.hero{display:block;height:84px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:0 0 20px}
:root[data-theme="dark"] .btn.main{color:#1b1405}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.main{color:#1b1405}}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.mini{padding:2px 8px;font-size:12px;margin-left:6px}
.pw{font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font:600 24px/1.1 Newsreader,Georgia,serif}.stat span{font-size:13px;color:var(--mute)}.stat.bad b{color:var(--bad)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.box ul{list-style:none;margin:10px 0 0;padding:0}.box li{padding:9px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;font-size:14px}
.box li span,.empty{color:var(--mute);font-size:13px}.empty{padding:24px 0;font-size:14px}
.lk{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;font-size:14px}
.box li:has(.lk){flex-direction:row}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(540px,92vw);padding:22px;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 4px}
.chk{display:flex;gap:6px;align-items:center;font-weight:400;margin:6px 0 0}.chk input{width:auto}
#gate .hero{height:auto;width:100%;max-width:340px;margin:0 auto 14px}
.err{color:var(--bad);font-size:13px;margin:10px 0 0;min-height:1em}
@media(max-width:760px){body{display:block}nav{width:auto;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px}nav h2{display:none}nav .logo{display:none}nav button{width:auto;white-space:nowrap;gap:6px;background:rgba(255,255,255,.07);flex:none}main{padding-top:20px}}
</style>
</head>
<body>
<nav id="nav" aria-label="Módulos"></nav>
<main>
<div class="head"><div><h1 id="t"></h1><p class="sub"><span id="s"></span> <span id="st"></span></p></div><div id="act"></div></div>
<div id="msg" role="status"></div>
<div class="filters" id="flt" hidden><input type="search" id="q" placeholder="Buscar por nome, CPF, tipo ou andamento" aria-label="Buscar"><select id="fs" aria-label="Filtrar por situação"></select><select id="fr" aria-label="Filtrar por responsável"></select></div>
<div id="c"></div>
</main>
<dialog id="gate"><img class="hero" alt="Flavio Junior Advocacia" id="gl"><h3>Acesso restrito</h3><p class="sub" id="g_hint"></p>
<div id="g_acc"><label for="g_email">E-mail</label><input id="g_email" type="email" autocomplete="username"><label for="g_pw">Senha de acesso</label><input id="g_pw" type="password" autocomplete="current-password"></div>
<label for="g_key">Senha de criptografia</label><input id="g_key" type="password" autocomplete="off">
<div id="g_key2w" hidden><label for="g_key2">Repita a senha de criptografia</label><input id="g_key2" type="password" autocomplete="off"></div>
<p class="err" id="g_err" role="alert"></p><div class="row"><button class="btn main" id="g_go">Entrar</button><button class="btn" id="g_out" hidden>Sair</button></div></dialog>
<dialog id="d"><h3 id="ft"></h3><div id="ff"></div><div class="row"><button class="btn main" id="fsv">Salvar</button><button class="btn" id="fx">Cancelar</button></div></dialog>

XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Nome do Cliente","Tipo de Demanda","Situação Processual","CPF","SENHA GOV","Responsável","Observações","Valor"],...S.cases.map(c=>[c.nome,c.tipo,c.sit,c.cpf,c.senha,c.resp,c.obs,c.valor])]),"Controle Processual");
XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["NOME","PAGAMENTO","PARCELA","PAGO","DIA"],...S.fees.map(f=>[f.nome,f.total,f.parc,f.pago,dd(f.dia)])]),"FINANCEIRO");
XLSX.writeFile(wb,"backup-flavio-junior-"+today()+".xlsx");msg("Backup baixado. Ele contém CPFs e senhas sem criptografia: guarde em local seguro.")}
const cnt=k=>k=="cases"?S.cases.length:k=="fees"?S.fees.filter(f=>saldo(f)>0).length:k=="tasks"?S.tasks.filter(t=>!t.done).length:"";
function render(){
$("nav").innerHTML='<img class="logo" alt="Flavio Junior Advocacia" src="'+LOGO_V+'">'+NAV.map(([k,n])=>`<button data-v="${k}" aria-pressed="${V==k}">${n}<span>${cnt(k)}</span></button>`).join("")+'<button data-lock style="margin-top:14px">Bloquear e sair</button>';
$("t").textContent=V=="home"?"Painel do escritório":E[V].n;
$("act").innerHTML=(V=="home"?"":`<button class="btn main" data-new="${V}">Novo ${E[V].s}</button>`)+(V=="tasks"?"":'<label class="btn" for="imp">Importar planilha</label><input id="imp" type="file" accept=".xlsx,.xls" hidden><button class="btn" data-exp>Exportar planilha</button>');
$("flt").hidden=V=="home";$("fs").hidden=$("fr").hidden=V!="cases";
if(!ready){$("c").innerHTML='<p class="empty">Carregando seus dados...</p>';return}
if(V=="home"){$("s").textContent="Hoje, "+dd(today());$("c").innerHTML=home();return}
if(V=="cases"){const o=(a,all,cur)=>`<option value="">${all}</option>`+a.map(g=>`<option value="${esc(g.k)}"${g.k==cur?" selected":""}>${esc(g.l)} (${g.n})</option>`).join("");$("fs").innerHTML=o(groups("sit"),"Todas as situações",FS);$("fr").innerHTML=o(groups("resp"),"Todos os responsáveis",FR)}
let l=S[V].filter(r=>(Object.values(r).join(" ")).toLowerCase().includes(Q)||norm(Object.values(r).join(" ")).includes(norm(Q)));
if(V=="cases")l=l.filter(r=>(!FS||norm(r.sit)==FS)&&(!FR||norm(r.resp)==FR));
const dk=(d)=>d||"9999";
l.sort((a,b)=>V=="cases"?String(a.nome).localeCompare(b.nome):V=="tasks"?(+!!a.done-+!!b.done)||a.data.localeCompare(b.data):(+(saldo(a)==0)-+(saldo(b)==0))||dk(a.dia).localeCompare(dk(b.dia)));
$("s").textContent=l.length+" "+(l.length==1?E[V].s:E[V].n.toLowerCase());
$("c").innerHTML=l.length?'<div class="grid">'+l.map(r=>card(V,r)).join("")+"</div>":`<p class="empty">${S[V].length?"Nada encontrado com esses filtros.":"Nenhum registro ainda. Use Novo "+E[V].s+" ou Importar planilha."}</p>`}
function card(k,r){let tag="",tc="",title="",lines=[],extra="",cls="";const id=`data-k="${k}" data-id="${r.id}"`;
if(k=="cases"){tag=r.sit||"Sem situação";tc=tcSit(r.sit);title=r.nome;lines=[r.tipo,r.resp&&"Responsável: "+r.resp,r.valor!==""&&r.valor!=null&&"Honorários: "+brl(r.valor),r.obs];
if(r.tel)extra=`<a class="btn" target="_blank" rel="noopener" href="${wa(r.tel,"Olá, "+String(r.nome).split(" ")[0]+"! ")}">WhatsApp</a>`}
if(k=="fees"){const s=saldo(r),late=s>0&&r.dia&&r.dia<today();tag=tot(r)>0&&s==0?"Quitado":late?"Vencido":s>0?"Em aberto":pg(r)>0?"Recebido":"Sem valor";tc=tag=="Quitado"||tag=="Recebido"?"ok":late?"bad":"";title=r.nome;
lines=[`Total ${brl(tot(r))} · Pago ${brl(pg(r))} · Saldo ${brl(s)}`,r.parc&&"Parcelas: "+r.parc,r.dia&&"Próximo pagamento: "+dd(r.dia)+(s>0?" ("+when(r.dia)+")":"")];
const c=byName(r.nome);if(s>0&&c&&c.tel)extra=`<a class="btn" target="_blank" rel="noopener" href="${wa(c.tel,"Olá, "+String(r.nome).split(" ")[0]+"! Tudo bem? Passando para lembrar sobre o saldo de honorários de "+brl(s)+(r.dia?", com vencimento em "+dd(r.dia):"")+". Caso já tenha efetuado o pagamento, por favor desconsidere. Se precisar de alguma facilidade, pode nos falar.")}">Cobrar</a>`}
if(k=="tasks"){const late=!r.done&&r.data<today();tag=r.done?"Concluído":late?"Atrasado":r.pri;tc=r.done?"ok":late||r.pri=="Urgente"?"bad":"";title=r.titulo;cls=r.done?" done":"";lines=[dd(r.data)+(r.done?"":" · "+when(r.data)),caseLabel(r.caso),r.resp&&"Responsável: "+r.resp];extra=`<button class="btn" ${id} data-tog>${r.done?"Reabrir":"Concluir"}</button>`}
let sec="";if(k=="cases"){if(r.cpf)sec+=`<p>CPF: ${esc(r.cpf)}<button class="btn mini" ${id} data-copy="cpf">Copiar</button></p>`;if(r.senha)sec+=`<p>Senha GOV: <span class="pw" id="pw_${r.id}">••••••••</span><button class="btn mini" ${id} data-pw>Mostrar</button><button class="btn mini" ${id} data-copy="senha">Copiar</button></p>`}
return`<article class="card${cls}"><span class="tag ${tc}">${esc(tag)}</span><h3>${esc(title)}</h3>${lines.filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join("")}${sec}<div class="row">${extra}<button class="btn" ${id} data-edit>Editar</button><button class="btn danger" ${id} data-del>Excluir</button></div></article>`}
function home(){const h=today();
const op=S.tasks.filter(t=>!t.done).sort((a,b)=>a.data.localeCompare(b.data)),late=op.filter(t=>t.data<h).length,prox=op.filter(t=>t.data>=h&&diff(t.data)<=7).length;
const open=S.fees.filter(f=>saldo(f)>0),vc=open.filter(f=>f.dia&&f.dia<h).sort((a,b)=>a.dia.localeCompare(b.dia));
const st=[["Processos",S.cases.length],["Prazos atrasados",late,late],["Prazos nos próximos 7 dias",prox],["Total contratado",brl(sum(S.fees,tot))],["Recebido",brl(sum(S.fees,pg))],["A receber",brl(sum(S.fees,saldo))],["Vencido",brl(sum(vc,saldo)),vc.length]];
const gl=(a,att)=>a.length?"<ul>"+a.slice(0,10).map(g=>`<li><button class="lk" ${att}="${esc(g.k)}"><span>${esc(g.l)}</span><b>${g.n}</b></button></li>`).join("")+"</ul>":'<p class="empty">Sem dados ainda.</p>';
const empty=!S.cases.length?`<div class="box" style="margin-bottom:18px"><h3>Comece por aqui</h3><p class="sub" style="margin:6px 0 12px">Importe sua planilha de controle processual ou cadastre o primeiro processo. A importação é feita no seu navegador e vai direto para a sua conta.</p><label class="btn main" for="imp">Importar planilha</label> <button class="btn" data-new="cases">Novo processo</button></div>`:"";
return `<img class="hero" alt="Flavio Junior Advocacia" src="${LOGO_H}">`+empty+`<div class="stats">${st.map(([n,v,b])=>`<div class="stat${b?" bad":""}"><b>${v}</b><span>${n}</span></div>`).join("")}</div><div class="two"><div class="box"><h3>Processos por situação</h3>${gl(groups("sit"),"data-fsit")}</div><div class="box"><h3>Processos por responsável</h3>${gl(groups("resp"),"data-fresp")}</div><div class="box"><h3>Prazos em aberto</h3>${op.length?"<ul>"+op.slice(0,6).map(t=>`<li><b>${esc(t.titulo)}</b><span>${dd(t.data)} · ${when(t.data)}${t.caso?" · "+esc(caseLabel(t.caso)):""}</span></li>`).join("")+"</ul>":'<p class="empty">Nenhum prazo em aberto.</p>'}</div><div class="box"><h3>Pagamentos vencidos</h3>${vc.length?"<ul>"+vc.slice(0,6).map(f=>`<li><b>${esc(f.nome)} · ${brl(saldo(f))}</b><span>${dd(f.dia)} · ${when(f.dia)}</span></li>`).join("")+"</ul>":'<p class="empty">Nenhum pagamento vencido.</p>'}</div></div>`}
function openForm(k,id){ED={k,id};const r=id?S[k].find(x=>x.id==id):{};$("ft").textContent=(id?"Editar ":"Novo ")+E[k].s;
$("ff").innerHTML=E[k].f.map(([n,l,t,rq,o])=>{const v=r[n]??"",a=`id="f_${n}"`;let i;
if(t=="select")i=`<select ${a}>${o.map(x=>`<option${x==v?" selected":""}>${x}</option>`).join("")}</select>`;
else if(t=="refcase")i=`<select ${a}><option value="">Nenhum</option>${S.cases.slice().sort((x,y)=>String(x.nome).localeCompare(y.nome)).map(c=>`<option value="${c.id}"${c.id==v?" selected":""}>${esc(caseLabel(c.id))}</option>`).join("")}</select>`;
else if(t=="textarea")i=`<textarea ${a} rows="3">${esc(v)}</textarea>`;
else if(t=="password")i=`<input ${a} type="password" autocomplete="new-password" value="${esc(v)}"><label class="chk"><input type="checkbox" data-showpw> Mostrar senha</label>`;
else i=`<input ${a} type="${t}"${t=="number"?' step="0.01" min="0" inputmode="decimal"':""}${o&&typeof o=="string"?` list="dl_${n}"`:""} value="${esc(v)}">${o&&typeof o=="string"?`<datalist id="dl_${n}">${dl(o).map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`:""}`;
return`<label for="f_${n}">${l}${rq?" *":""}</label>${i}`}).join("")+'<p class="err" id="fe" role="alert"></p>';$("d").showModal()}
function submit(){const {k,id}=ED,o={};for(const [n,l,t,rq] of E[k].f){const v=$("f_"+n).value.trim();if(rq&&!v){$("fe").textContent="Preencha o campo: "+l;return}o[n]=t=="number"?(v===""?"":+v):v}
if(id)Object.assign(S[k].find(x=>x.id==id),o);else S[k].push(Object.assign({id:uid()},k=="tasks"?{done:false}:{},o));
$("d").close();save(k);render()}
const num=v=>{if(typeof v=="number")return v;const n=parseFloat(String(v).replace(/[^\d,.-]/g,"").replace(",","."));return isNaN(n)?"":n};
const dt=v=>{if(typeof v=="number"&&v>20000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const m=String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:""};
async function doImport(file){if(typeof XLSX==="undefined"){msg("Não foi possível carregar o leitor de planilhas. Verifique a internet e tente de novo.",1);return}
try{const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});let nc=0,nf=0,mg=0,sk=0;const t=v=>String(v??"").trim(),up=v=>t(v).toUpperCase();
const keyOf=r=>String(r.cpf||"").replace(/\D/g,"")||(norm(r.nome)+"|"+norm(r.tipo)),idx=new Map(S.cases.map(c=>[keyOf(c),c])),fk=new Set(S.fees.map(f=>norm(f.nome)+"|"+f.total+"|"+f.dia));
for(const name of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:""}),h=(rows[0]||[]).map(norm);
if(h[0]=="NOME"&&h.includes("PAGAMENTO")){rows.slice(1).forEach(r=>{const nome=t(r[0]);if(!nome)return;const f={id:uid(),nome,total:num(r[1]),parc:num(r[2]),pago:num(r[3]),dia:dt(r[4])};if(f.total===""&&f.pago===""&&!f.dia)return;const k=norm(nome)+"|"+f.total+"|"+f.dia;if(fk.has(k)){sk++;return}fk.add(k);S.fees.push(f);nf++})}
else if(h[1]=="TIPO DE DEMANDA"){const B=(h[3]||"").startsWith("VALORES");rows.slice(1).forEach(r=>{const nome=t(r[0]);if(!nome)return;
const c=B?{nome,tipo:t(r[1]),sit:up(r[2]),valor:num(r[3]),cpf:t(r[4]),senha:t(r[5]),resp:up(r[6]),obs:""}:{nome,tipo:t(r[1]),sit:up(r[2]),valor:num(r[7]??""),cpf:t(r[3]),senha:t(r[4]),resp:up(r[5]),obs:t(r[6])};
const k=keyOf(c),e=idx.get(k);if(e){let ch=0;for(const f in c)if((e[f]===""||e[f]==null)&&c[f]!==""){e[f]=c[f];ch=1}ch?mg++:sk++;return}
c.id=uid();S.cases.push(c);idx.set(k,c);nc++})}}
KEYS.slice(0,2).forEach(save);render();msg(`Importação concluída: ${nc} processos novos, ${nf} lançamentos financeiros, ${mg} registros completados com dados de outra aba e ${sk} já existentes ignorados.`)}catch(e){msg("Não consegui ler esse arquivo. Confirme que é uma planilha .xlsx.",1)}}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
if("lock" in b.dataset){sb.auth.signOut().then(()=>location.reload());return}
if("exp" in b.dataset){exportXlsx();return}
if(b.dataset.v){V=b.dataset.v;Q="";FS=FR="";$("q").value="";msg("");render();return}
if(b.dataset.fsit!==undefined||b.dataset.fresp!==undefined){V="cases";Q="";$("q").value="";FS=b.dataset.fsit??"";FR=b.dataset.fresp??"";render();return}
if(b.dataset.new){openForm(b.dataset.new);return}
const k=b.dataset.k,id=b.dataset.id;if(!k)return;const r=S[k].find(x=>x.id==id);
if("edit" in b.dataset)openForm(k,id);
if("tog" in b.dataset){r.done=!r.done;save(k);render()}
if("pw" in b.dataset){const el=$("pw_"+id);if(el.dataset.on){el.textContent="••••••••";delete el.dataset.on;b.textContent="Mostrar"}else{el.textContent=r.senha;el.dataset.on=1;b.textContent="Ocultar";setTimeout(()=>{if(el.dataset.on){el.textContent="••••••••";delete el.dataset.on;b.textContent="Mostrar"}},15000)}}
if(b.dataset.copy){const v=r[b.dataset.copy];navigator.clipboard.writeText(v).then(()=>{b.textContent="Copiado"},()=>{b.textContent="Não copiou"}).finally(()=>setTimeout(()=>b.textContent="Copiar",1500))}
if("del" in b.dataset){if(b.dataset.armed){S[k]=S[k].filter(x=>x.id!=id);save(k);render()}else{b.dataset.armed=1;b.textContent="Confirmar exclusão";setTimeout(()=>{b.textContent="Excluir";delete b.dataset.armed},3000)}}});
document.addEventListener("change",e=>{const s=e.target;if(s.id=="imp"&&s.files[0]){doImport(s.files[0]);s.value=""}if(s.dataset.showpw!==undefined)$("f_senha").type=s.checked?"text":"password";if(s.id=="fs"){FS=s.value;render()}if(s.id=="fr"){FR=s.value;render()}});
$("q").oninput=e=>{Q=e.target.value.toLowerCase();render()};
$("fsv").onclick=submit;$("fx").onclick=()=>$("d").close();
render();boot();
</script>
